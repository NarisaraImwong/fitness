<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker with AI - ครูไอซ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ai-active { border: 2px solid #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="text-gray-800">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative pb-24">
    <!-- ส่วนหัวแอป -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-500 text-white p-6 sticky top-0 z-20 shadow-lg rounded-b-[2rem]">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-blue-100 text-xs">ยินดีต้อนรับคุณครูไอซ์</p>
                <h1 class="text-xl font-bold">Fitness Sync AI</h1>
            </div>
            <div id="sync-status" class="bg-blue-400/30 px-3 py-1 rounded-full border border-blue-200/50 text-[10px] backdrop-blur-sm">
                Ready to Sync
            </div>
        </div>
    </header>

    <main class="p-4 mt-2">
        <form id="fitness-form" class="space-y-5">
            <!-- วันที่และน้ำหนัก -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">วันที่บันทึก</label>
                    <input type="date" id="date" class="w-full bg-transparent font-bold text-blue-600 outline-none">
                </div>
                <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">น้ำหนักตัว (kg)</label>
                    <input type="number" id="weight" step="0.1" placeholder="0.0" class="w-full bg-transparent font-bold text-blue-600 outline-none">
                </div>
            </div>

            <!-- ส่วน AI คำนวณอาหาร -->
            <div class="bg-emerald-50 p-5 rounded-[2rem] border border-emerald-100 shadow-sm space-y-4">
                <div class="flex items-center gap-2 mb-2">
                    <i class="ph ph-sparkle text-emerald-600 text-xl"></i>
                    <h3 class="text-sm font-bold text-emerald-800">ผู้ช่วย AI ประเมินอาหาร</h3>
                </div>

                <div class="space-y-3">
                    <div class="flex gap-2">
                        <input type="text" id="foodName" placeholder="เช่น กะเพราไก่ไข่ดาว" class="flex-grow bg-white border border-emerald-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
                        <button type="button" id="aiSearchBtn" onclick="calculateKcalWithAI()" class="bg-blue-600 text-white px-5 rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1">
                            <span id="ai-btn-text">ถาม AI</span>
                        </button>
                    </div>

                    <div class="flex gap-2 items-end">
                        <div class="w-1/3 relative">
                            <label class="text-[9px] font-bold text-emerald-600 ml-1">KCAL</label>
                            <input type="number" id="singleFoodKcal" placeholder="0" class="w-full bg-white border border-emerald-200 rounded-xl p-3 text-sm font-black text-emerald-600 outline-none shadow-inner">
                            <div id="ai-loader" class="hidden absolute right-3 bottom-3">
                                <div class="loading-spinner"></div>
                            </div>
                        </div>
                        <button type="button" onclick="addFoodItem()" class="flex-grow bg-emerald-600 text-white font-bold h-[46px] rounded-xl text-sm shadow-lg hover:bg-emerald-700 active:scale-95 transition-all">
                            เพิ่มรายการ
                        </button>
                    </div>
                </div>

                <!-- รายการอาหาร -->
                <div id="food-list-area" class="hidden border-t border-emerald-200 pt-3">
                    <ul id="foodList" class="space-y-1.5 mb-3"></ul>
                    <div class="bg-emerald-600 text-white p-3 rounded-xl flex justify-between items-center shadow-md">
                        <span class="text-[10px] font-bold uppercase">ยอดรวมอาหารวันนี้:</span>
                        <div class="flex items-center gap-1">
                            <input type="number" id="foodKcal" value="0" class="w-20 text-right font-black bg-transparent outline-none" readonly>
                            <span class="text-xs">KCAL</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ข้อมูลกิจกรรม -->
            <div class="bg-blue-50 p-5 rounded-[2rem] border border-blue-100 shadow-sm space-y-4">
                <h3 class="text-sm font-bold text-blue-800 flex items-center gap-2">
                    <i class="ph ph-lightning text-xl"></i> กิจกรรมจาก Apple Watch
                </h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-3 rounded-xl border border-blue-100">
                        <label class="text-[9px] font-bold text-blue-400 block uppercase">จำนวนก้าว</label>
                        <input type="number" id="steps" placeholder="0" class="w-full outline-none font-bold text-blue-600 text-lg">
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-blue-100">
                        <label class="text-[9px] font-bold text-blue-400 block uppercase">Watch kcal</label>
                        <input type="number" id="watchKcal" placeholder="0" class="w-full outline-none font-bold text-blue-600 text-lg">
                    </div>
                </div>
            </div>

            <!-- เลือกกิจกรรมการออกกำลังกาย -->
            <div class="bg-purple-50 p-5 rounded-[2rem] border border-purple-100 shadow-sm space-y-3">
                <h3 class="text-sm font-bold text-purple-800 flex items-center gap-2">
                    <i class="ph ph-bicycle text-xl"></i> การออกกำลังกายเสริม
                </h3>
                <select id="machineType" class="w-full border border-purple-200 rounded-xl p-3 outline-none bg-white text-sm">
                    <option value="None">ไม่ได้ออกกำลังกาย</option>
                    <option value="Treadmill">ลู่วิ่งไฟฟ้า</option>
                    <option value="Cycling">ปั่นจักรยาน</option>
                    <option value="Swimming">ว่ายน้ำ</option>
                    <option value="Walking">เดินเร็ว</option>
                    <option value="WeightTraining">เวทเทรนนิ่ง</option>
                </select>
                <div id="machineDetails" class="hidden grid grid-cols-3 gap-2">
                    <input type="number" id="machineKcal" placeholder="แคล" class="border rounded-xl p-3 text-xs shadow-inner">
                    <input type="number" id="duration" placeholder="นาที" class="border rounded-xl p-3 text-xs shadow-inner">
                    <input type="number" id="distance" step="0.1" placeholder="กม." class="border rounded-xl p-3 text-xs shadow-inner">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all hover:bg-blue-700">
                <i class="ph ph-paper-plane-tilt text-2xl"></i>
                <span>ส่งข้อมูลไป Google Sheets</span>
            </button>
        </form>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 flex justify-around p-4 shadow-2xl rounded-t-3xl">
        <button class="flex flex-col items-center text-blue-600">
            <i class="ph-fill ph-house-line text-2xl"></i>
            <span class="text-[10px] font-bold">หน้าแรก</span>
        </button>
        <button class="flex flex-col items-center text-gray-400" onclick="alert('ฟีเจอร์นี้กำลังพัฒนาค่ะ')">
            <i class="ph ph-chart-line text-2xl"></i>
            <span class="text-[10px] font-bold">สถิติ</span>
        </button>
    </nav>
</div>

<!-- Modal แจ้งเตือนสำเร็จ -->
<div id="successModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-[2.5rem] p-10 flex flex-col items-center w-80 shadow-2xl text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
            <i class="ph-fill ph-check-circle text-6xl text-green-500"></i>
        </div>
        <h3 class="text-2xl font-bold text-gray-800">เรียบร้อย!</h3>
        <p class="text-sm text-gray-400 mt-2">ข้อมูลบันทึกลง Google Sheets<br>ของคุณครูไอซ์แล้วค่ะ</p>
        <button onclick="location.reload()" class="mt-8 bg-blue-600 text-white py-4 rounded-2xl font-bold w-full shadow-lg active:scale-95 transition-all">ตกลง</button>
    </div>
</div>

<script>
    // ---------------------------------------------------------
    // 🔗 ตั้งค่าการเชื่อมต่อ (แก้ไขตรงนี้)
    // ---------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzF-FGC967CxqDPy-G2otPnxg00qIjN6S6PNRhUEyBAeq6YeVc-uU0dRW5AVxR1A-KU/exec";
    const GEMINI_API_KEY = "AIzaSyC5MrgcUs0PVksZqDd3PIuzA_499lJrPmM"; 
    // ---------------------------------------------------------

    let totalFoodKcal = 0;

    // ตั้งค่าวันที่ปัจจุบันอัตโนมัติ
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // แสดง/ซ่อน รายละเอียดเครื่องเล่น
    document.getElementById('machineType').addEventListener('change', function() {
        document.getElementById('machineDetails').classList.toggle('hidden', this.value === 'None');
    });

    // --- ระบบ AI คำนวณแคลอรี่ ---
    async function calculateKcalWithAI() {
        const food = document.getElementById('foodName').value;
        if(!food) { alert("ครูไอซ์อย่าลืมพิมพ์ชื่ออาหารก่อนนะคะ"); return; }
        
        const btn = document.getElementById('aiSearchBtn');
        const loader = document.getElementById('ai-loader');
        const kInput = document.getElementById('singleFoodKcal');
        const btnText = document.getElementById('ai-btn-text');

        // เริ่ม Loading
        btn.disabled = true;
        btnText.innerText = "กำลังคิด...";
        loader.classList.remove('hidden');
        kInput.classList.add('ai-active');

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ 
                        parts: [{ 
                            text: `Analyze calories for Thai dish: "${food}". Give only the number. Example: 450. No explanation.` 
                        }] 
                    }] 
                })
            });
            
            const res = await resp.json();
            const val = res.candidates[0].content.parts[0].text.trim().match(/\d+/);
            
            if(val) {
                kInput.value = val[0];
            } else {
                alert("AI งงนิดหน่อยค่ะ ลองพิมพ์ชื่ออาหารใหม่นะคะ");
            }
        } catch(e) { 
            console.error(e); 
            alert("การเชื่อมต่อ AI มีปัญหาค่ะ");
        } finally { 
            btn.disabled = false;
            btnText.innerText = "ถาม AI";
            loader.classList.add('hidden');
            kInput.classList.remove('ai-active');
        }
    }

    // ฟังก์ชันเพิ่มรายการอาหาร
    function addFoodItem() {
        const nameInput = document.getElementById('foodName');
        const kcalInput = document.getElementById('singleFoodKcal');
        const val = parseInt(kcalInput.value);

        if(!val) return;

        totalFoodKcal += val;
        document.getElementById('foodKcal').value = totalFoodKcal;
        document.getElementById('food-list-area').classList.remove('hidden');

        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-white p-2 px-3 rounded-xl border border-emerald-100 text-[11px]";
        li.innerHTML = `<span class="text-gray-600">${nameInput.value || 'อาหารทั่วไป'}</span><b class="text-emerald-600">${val} kcal</b>`;
        document.getElementById('foodList').prepend(li);

        nameInput.value = '';
        kcalInput.value = '';
    }

    // ส่งข้อมูลไป Google Sheets
    document.getElementById('fitness-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('sync-status');
        
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner"></div> <span class="ml-2">กำลังบันทึก...</span>`;
        status.innerText = "Syncing Data...";

        const payload = {
            date: document.getElementById('date').value,
            weight: parseFloat(document.getElementById('weight').value) || 0,
            steps: parseInt(document.getElementById('steps').value) || 0,
            watchKcal: parseInt(document.getElementById('watchKcal').value) || 0,
            foodKcal: totalFoodKcal,
            machineType: document.getElementById('machineType').value,
            machineKcal: parseInt(document.getElementById('machineKcal').value) || 0,
            duration: parseInt(document.getElementById('duration').value) || 0,
            distance: parseFloat(document.getElementById('distance').value) || 0
        };

        try {
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify(payload) 
            });
            document.getElementById('successModal').classList.remove('hidden');
        } catch (error) {
            alert("ขออภัยค่ะ ระบบขัดข้อง");
            btn.disabled = false;
            btn.innerHTML = `<span>ส่งข้อมูลไป Google Sheets</span>`;
        }
    });
</script>
</body>
</html>
