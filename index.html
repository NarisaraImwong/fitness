<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker AI - ครูไอซ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

<div class="max-w-md mx-auto bg-white min-h-screen relative pb-24 shadow-2xl">
    <!-- Header Section -->
    <header class="bg-blue-600 text-white p-8 rounded-b-[3rem] shadow-lg">
        <div class="flex justify-between items-start">
            <div>
                <p class="text-blue-100 text-xs mb-1">สวัสดีค่ะ คุณครูไอซ์</p>
                <h1 class="text-2xl font-bold">Fitness Sync AI</h1>
            </div>
            <div id="sync-status" class="bg-white/20 px-3 py-1 rounded-full text-[10px] border border-white/30 backdrop-blur-md">
                Ready to Sync
            </div>
        </div>
    </header>

    <main class="px-6 -mt-8">
        <form id="fitness-form" class="space-y-6">
            
            <!-- ส่วนข้อมูลพื้นฐาน -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-gray-100 card-shadow">
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">วันที่บันทึก</label>
                    <input type="date" id="date" class="w-full font-bold text-blue-600 outline-none">
                </div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 card-shadow">
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">น้ำหนัก (kg)</label>
                    <input type="number" id="weight" step="0.1" placeholder="0.0" class="w-full font-bold text-blue-600 outline-none">
                </div>
            </div>

            <!-- ส่วน AI ประเมินอาหาร -->
            <div class="bg-emerald-50/50 p-6 rounded-[2.5rem] border border-emerald-100 card-shadow">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white">
                        <i class="ph ph-sparkle text-lg"></i>
                    </div>
                    <h3 class="font-bold text-emerald-900">ผู้ช่วย AI ประเมินอาหาร</h3>
                </div>

                <div class="space-y-4">
                    <div class="flex gap-2">
                        <input type="text" id="foodName" placeholder="กินอะไรไปคะ?" class="flex-grow bg-white border border-emerald-200 rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
                        <button type="button" id="aiSearchBtn" onclick="calculateKcalWithAI()" class="bg-blue-600 text-white px-6 rounded-xl text-xs font-bold shadow-md hover:bg-blue-700 active:scale-95 transition-all">
                            <span id="ai-btn-text">ถาม AI</span>
                        </button>
                    </div>

                    <div class="flex gap-2 items-end">
                        <div class="w-1/3">
                            <label class="text-[9px] font-bold text-emerald-600 ml-1">KCAL</label>
                            <div class="relative">
                                <input type="number" id="singleFoodKcal" placeholder="0" class="w-full bg-white border border-emerald-200 rounded-xl p-4 text-sm font-black text-emerald-600 outline-none">
                                <div id="ai-loader" class="hidden absolute right-3 top-4">
                                    <div class="loading-spinner"></div>
                                </div>
                            </div>
                        </div>
                        <button type="button" onclick="addFoodItem()" class="flex-grow bg-emerald-600 text-white font-bold h-[53px] rounded-xl text-sm shadow-lg hover:bg-emerald-700 active:scale-95 transition-all">
                            เพิ่มรายการอาหาร
                        </button>
                    </div>
                </div>

                <!-- รายการอาหารที่เพิ่มแล้ว -->
                <div id="food-list-area" class="hidden mt-4 pt-4 border-t border-emerald-100">
                    <ul id="foodList" class="space-y-2 mb-4"></ul>
                    <div class="bg-emerald-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-lg">
                        <span class="text-[10px] font-bold uppercase tracking-wider">แคลอรี่รวมวันนี้:</span>
                        <div class="flex items-center gap-1">
                            <input type="number" id="foodKcal" value="0" class="w-20 text-right font-black bg-transparent outline-none text-xl" readonly>
                            <span class="text-xs font-bold">KCAL</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ส่วน Apple Watch -->
            <div class="bg-blue-50/50 p-6 rounded-[2.5rem] border border-blue-100 card-shadow">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white">
                        <i class="ph ph-lightning text-lg"></i>
                    </div>
                    <h3 class="font-bold text-blue-900">Apple Watch Activity</h3>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-blue-50">
                        <label class="text-[9px] font-bold text-blue-400 block uppercase mb-1">ก้าวเดิน</label>
                        <input type="number" id="steps" placeholder="0" class="w-full outline-none font-bold text-blue-600 text-xl">
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-blue-50">
                        <label class="text-[9px] font-bold text-blue-400 block uppercase mb-1">Watch kcal</label>
                        <input type="number" id="watchKcal" placeholder="0" class="w-full outline-none font-bold text-blue-600 text-xl">
                    </div>
                </div>
            </div>

            <!-- ส่วนการออกกำลังกายเสริม -->
            <div class="bg-purple-50/50 p-6 rounded-[2.5rem] border border-purple-100 card-shadow">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center text-white">
                        <i class="ph ph-bicycle text-lg"></i>
                    </div>
                    <h3 class="font-bold text-purple-900 text-sm">การออกกำลังกายเสริม</h3>
                </div>
                <select id="machineType" class="w-full border border-purple-200 rounded-xl p-4 outline-none bg-white text-sm mb-3">
                    <option value="None">-- ไม่ได้ออกกำลังกาย --</option>
                    <option value="Treadmill">ลู่วิ่งไฟฟ้า (Treadmill)</option>
                    <option value="Cycling">ปั่นจักรยาน (Cycling)</option>
                    <option value="Swimming">ว่ายน้ำ (Swimming)</option>
                    <option value="Walking">เดินเร็ว (Walking)</option>
                    <option value="WeightTraining">เวทเทรนนิ่ง (Weight)</option>
                    <option value="Yoga">โยคะ (Yoga)</option>
                </select>
                <div id="machineDetails" class="hidden grid grid-cols-3 gap-2">
                    <div class="bg-white p-3 rounded-xl border border-purple-100">
                        <label class="text-[8px] font-bold text-purple-400 block uppercase">KCAL</label>
                        <input type="number" id="machineKcal" placeholder="0" class="w-full outline-none text-xs font-bold text-purple-600">
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-purple-100">
                        <label class="text-[8px] font-bold text-purple-400 block uppercase">นาที</label>
                        <input type="number" id="duration" placeholder="0" class="w-full outline-none text-xs font-bold text-purple-600">
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-purple-100">
                        <label class="text-[8px] font-bold text-purple-400 block uppercase">กม.</label>
                        <input type="number" id="distance" step="0.1" placeholder="0" class="w-full outline-none text-xs font-bold text-purple-600">
                    </div>
                </div>
            </div>

            <!-- ปุ่มบันทึก -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-5 rounded-[2rem] shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all hover:bg-blue-700">
                <i class="ph ph-paper-plane-tilt text-2xl"></i>
                <span>บันทึกข้อมูลไป Google Sheets</span>
            </button>
        </form>
    </main>

    <!-- Footer Space -->
    <div class="h-10"></div>
</div>

<!-- Modal Success -->
<div id="successModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-[3rem] p-10 flex flex-col items-center w-80 text-center shadow-2xl mx-4">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
            <i class="ph-fill ph-check-circle text-6xl text-green-500"></i>
        </div>
        <h3 class="text-2xl font-bold text-gray-800">บันทึกสำเร็จ!</h3>
        <p class="text-sm text-gray-400 mt-2">ข้อมูลถูกส่งไปยังชีท<br>ของคุณครูไอซ์แล้วค่ะ</p>
        <button onclick="location.reload()" class="mt-8 bg-blue-600 text-white py-4 rounded-2xl font-bold w-full shadow-lg active:scale-95 transition-all">ตกลง</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzF-FGC967CxqDPy-G2otPnxg00qIjN6S6PNRhUEyBAeq6YeVc-uU0dRW5AVxR1A-KU/exec";
    const GEMINI_API_KEY = "AIzaSyC5MrgcUs0PVksZqDd3PIuzA_499lJrPmM"; 

    let totalFoodKcal = 0;

    // ตั้งค่าวันที่ปัจจุบัน
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // เปิด/ปิด รายละเอียดเครื่องเล่น
    document.getElementById('machineType').addEventListener('change', function() {
        document.getElementById('machineDetails').classList.toggle('hidden', this.value === 'None');
    });

    // --- ระบบ AI คำนวณแคลอรี่ ---
    async function calculateKcalWithAI() {
        const food = document.getElementById('foodName').value;
        if(!food) { alert("อย่าลืมพิมพ์ชื่ออาหารก่อนนะคะ"); return; }
        
        const btn = document.getElementById('aiSearchBtn');
        const loader = document.getElementById('ai-loader');
        const kInput = document.getElementById('singleFoodKcal');
        const btnText = document.getElementById('ai-btn-text');

        btn.disabled = true;
        btnText.innerText = "...";
        loader.classList.remove('hidden');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ 
                        parts: [{ 
                            text: `Provide the calorie count for the dish: "${food}". Return only the numeric value. No text.` 
                        }] 
                    }] 
                })
            });
            
            const data = await response.json();
            if (data.candidates && data.candidates[0].content) {
                const kcal = data.candidates[0].content.parts[0].text.trim().match(/\d+/);
                if(kcal) kInput.value = kcal[0];
            }
        } catch(e) { 
            console.error(e);
            alert("การเชื่อมต่อ AI มีปัญหาชั่วคราวค่ะ");
        } finally { 
            btn.disabled = false;
            btnText.innerText = "ถาม AI";
            loader.classList.add('hidden');
        }
    }

    // เพิ่มรายการอาหารลงในลิสต์
    function addFoodItem() {
        const nameInput = document.getElementById('foodName');
        const kcalInput = document.getElementById('singleFoodKcal');
        const val = parseInt(kcalInput.value);

        if(!val) return;

        totalFoodKcal += val;
        document.getElementById('foodKcal').value = totalFoodKcal;
        document.getElementById('food-list-area').classList.remove('hidden');

        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-white p-3 px-4 rounded-xl border border-emerald-50 text-xs shadow-sm";
        li.innerHTML = `<span class="text-gray-600 font-medium">${nameInput.value || 'อาหารทั่วไป'}</span><b class="text-emerald-600">${val} kcal</b>`;
        document.getElementById('foodList').prepend(li);

        nameInput.value = '';
        kcalInput.value = '';
    }

    // ส่งข้อมูลไป Google Sheets
    document.getElementById('fitness-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner"></div> <span class="ml-2">กำลังส่งข้อมูล...</span>`;

        const payload = {
            date: document.getElementById('date').value,
            weight: parseFloat(document.getElementById('weight').value) || 0,
            steps: parseInt(document.getElementById('steps').value) || 0,
            watchKcal: parseInt(document.getElementById('watchKcal').value) || 0,
            foodKcal: totalFoodKcal,
            machineType: document.getElementById('machineType').value,
            machineKcal: parseInt(document.getElementById('machineKcal').value) || 0,
            duration: parseInt(document.getElementById('duration').value) || 0,
            distance: parseFloat(document.getElementById('distance').value) || 0
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            document.getElementById('successModal').classList.remove('hidden');
        } catch (error) {
            alert("บันทึกไม่สำเร็จ ลองอีกครั้งนะคะ");
            btn.disabled = false;
            btn.innerHTML = `<span>บันทึกข้อมูลไป Google Sheets</span>`;
        }
    });
</script>
</body>
</html>
