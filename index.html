<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Fitness Tracker (Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: bold; }
        .tab-inactive { color: #6b7280; }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="ph ph-heartbeat text-2xl"></i> My Fitness Sync
        </h1>
        <div id="sync-status" class="text-[10px] bg-blue-500 px-2 py-1 rounded-full border border-blue-400">
            Cloud Ready
        </div>
    </header>

    <main id="main-content" class="p-4">
        <section id="form-view" class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">บันทึกข้อมูลรายวัน</h2>
            
            <form id="fitness-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">วันที่</label>
                    <input type="date" id="date" class="w-full border rounded-lg p-2 bg-gray-50 outline-none" required>
                </div>

                <div class="bg-blue-50 p-3 rounded-lg space-y-3 border border-blue-100">
                    <h3 class="text-sm font-bold text-blue-800 flex items-center gap-1"><i class="ph ph-barbell"></i> ข้อมูลร่างกาย</h3>
                    <input type="number" id="weight" step="0.1" placeholder="น้ำหนักตัว (kg)" class="w-full border rounded-xl p-3 outline-none" required>
                </div>

                <div class="bg-green-50 p-3 rounded-lg space-y-3 border border-green-100">
                    <h3 class="text-sm font-bold text-green-800 flex items-center gap-1"><i class="ph ph-activity"></i> กิจกรรม & อาหาร</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="steps" placeholder="ก้าว" class="w-full border rounded-xl p-3 outline-none" required>
                        <input type="number" id="watchKcal" placeholder="Watch (kcal)" class="w-full border rounded-xl p-3 outline-none" required>
                    </div>
                    
                    <div class="border-t border-green-200 pt-3">
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="foodName" placeholder="ชื่ออาหาร" class="flex-grow border rounded-xl p-3 outline-none text-sm">
                            <button type="button" id="aiSearchBtn" onclick="calculateKcalWithAI()" class="bg-blue-600 text-white px-3 rounded-xl text-xs font-bold">AI</button>
                        </div>
                        <div class="flex gap-2 mb-3">
                            <input type="number" id="singleFoodKcal" placeholder="kcal" class="w-1/3 border rounded-xl p-3 outline-none text-sm">
                            <button type="button" onclick="addFoodItem()" class="flex-grow bg-emerald-600 text-white font-bold rounded-xl text-sm">เพิ่มอาหาร</button>
                        </div>
                        <ul id="foodList" class="space-y-1 mb-2 max-h-24 overflow-y-auto"></ul>
                        <div class="bg-white p-2 rounded-xl border border-green-200 flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-500">รวมวันนี้:</span>
                            <input type="number" id="foodKcal" value="0" class="w-20 text-right font-black text-emerald-600 outline-none" readonly>
                        </div>
                    </div>
                </div>

                <div class="bg-purple-50 p-3 rounded-lg space-y-3 border border-purple-100">
                    <h3 class="text-sm font-bold text-purple-800 flex items-center gap-1"><i class="ph ph-bicycle"></i> การออกกำลังกาย</h3>
                    <select id="machineType" class="w-full border rounded-xl p-3 outline-none bg-white shadow-sm">
                        <option value="None">ไม่ได้ออกกำลังกาย</option>
                        <optgroup label="คาร์ดิโอ">
                            <option value="Running">วิ่ง (Running)</option>
                            <option value="Swimming">ว่ายน้ำ (Swimming)</option>
                            <option value="Walking">เดินเร็ว (Power Walking)</option>
                            <option value="Cycling">ปั่นจักรยาน (Cycling)</option>
                        </optgroup>
                        <optgroup label="เครื่องเล่น">
                            <option value="Treadmill">ลู่วิ่งไฟฟ้า</option>
                            <option value="Elliptical">เครื่องเดินวงรี</option>
                        </optgroup>
                        <optgroup label="อื่นๆ">
                            <option value="WeightTraining">เวทเทรนนิ่ง</option>
                            <option value="Yoga">โยคะ/ยืดเหยียด</option>
                        </optgroup>
                    </select>
                    <!-- เพิ่มช่องระยะทาง (Distance) -->
                    <div id="machineDetails" class="hidden grid grid-cols-3 gap-2">
                        <div>
                            <label class="text-[10px] text-purple-600 font-bold ml-1">kcal</label>
                            <input type="number" id="machineKcal" placeholder="kcal" class="w-full border rounded-xl p-2 outline-none text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] text-purple-600 font-bold ml-1">นาที</label>
                            <input type="number" id="duration" placeholder="นาที" class="w-full border rounded-xl p-2 outline-none text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] text-purple-600 font-bold ml-1">กม. (km)</label>
                            <input type="number" id="distance" step="0.01" placeholder="กม." class="w-full border rounded-xl p-2 outline-none text-sm">
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="ph ph-cloud-arrow-up text-xl"></i> <span>บันทึกไปที่ Google Sheets</span>
                </button>
            </form>
        </section>

        <section id="dashboard-view" class="hidden space-y-4">
             <div class="bg-white border rounded-2xl p-4 shadow-sm">
                <canvas id="weightChart" height="200"></canvas>
            </div>
            <div id="historyList" class="space-y-2"></div>
        </section>
    </main>

    <nav class="bg-white border-t fixed bottom-0 w-full max-w-md flex justify-around p-3 shadow-md">
        <button onclick="switchTab('form')" id="tab-form" class="flex flex-col items-center tab-active w-1/2">
            <i class="ph ph-note-pencil text-2xl"></i><span class="text-[10px] font-bold">บันทึก</span>
        </button>
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center tab-inactive w-1/2 border-l">
            <i class="ph ph-chart-line-up text-2xl"></i><span class="text-[10px] font-bold">สถิติ</span>
        </button>
    </nav>
</div>

<div id="successModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-3xl p-8 flex flex-col items-center w-72 animate-fadeIn">
        <i class="ph-fill ph-check-circle text-6xl text-green-500 mb-4"></i>
        <h3 class="text-xl font-bold">บันทึกลงชีทสำเร็จ!</h3>
        <button onclick="closeModal()" class="mt-6 bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold w-full">ตกลง</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzF-FGC967CxqDPy-G2otPnxg00qIjN6S6PNRhUEyBAeq6YeVc-uU0dRW5AVxR1A-KU/exec";
    const GEMINI_API_KEY = ""; 

    let records = [];
    let currentFoodItems = [];
    let currentTotalFoodKcal = 0;

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    });

    function switchTab(tabName) {
        document.getElementById('form-view').classList.toggle('hidden', tabName !== 'form');
        document.getElementById('dashboard-view').classList.toggle('hidden', tabName !== 'dashboard');
        document.getElementById('tab-form').className = `flex flex-col items-center w-1/2 ${tabName === 'form' ? 'tab-active' : 'tab-inactive'}`;
        document.getElementById('tab-dashboard').className = `flex flex-col items-center w-1/2 border-l ${tabName === 'dashboard' ? 'tab-active' : 'tab-inactive'}`;
    }

    document.getElementById('machineType').addEventListener('change', function() {
        document.getElementById('machineDetails').classList.toggle('hidden', this.value === 'None');
    });

    function addFoodItem() {
        const n = document.getElementById('foodName'), k = document.getElementById('singleFoodKcal');
        if (!k.value) return;
        const item = { name: n.value || 'อาหาร', kcal: parseInt(k.value) };
        currentFoodItems.push(item);
        currentTotalFoodKcal += item.kcal;
        document.getElementById('foodKcal').value = currentTotalFoodKcal;
        document.getElementById('foodList').innerHTML += `<li class="text-[10px] flex justify-between bg-gray-50 p-1 px-2 rounded"><span>${item.name}</span><b>${item.kcal}</b></li>`;
        n.value = ''; k.value = '';
    }

    document.getElementById('fitness-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('sync-status');
        
        const payload = {
            date: document.getElementById('date').value,
            weight: parseFloat(document.getElementById('weight').value),
            steps: parseInt(document.getElementById('steps').value),
            watchKcal: parseInt(document.getElementById('watchKcal').value),
            foodKcal: parseInt(document.getElementById('foodKcal').value),
            machineType: document.getElementById('machineType').value,
            machineKcal: parseInt(document.getElementById('machineKcal').value) || 0,
            duration: parseInt(document.getElementById('duration').value) || 0,
            distance: parseFloat(document.getElementById('distance').value) || 0 // เพิ่มข้อมูลระยะทาง
        };

        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner"></div> <span>กำลังส่งข้อมูลไปที่ Google Sheets...</span>`;
        status.innerText = "Syncing...";
        status.classList.replace('bg-blue-500', 'bg-orange-500');

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            records.push(payload);
            showModal();
            resetForm();
        } catch (error) {
            console.error("Sync Error:", error);
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ Google Sheets");
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="ph ph-cloud-arrow-up text-xl"></i> <span>บันทึกไปที่ Google Sheets</span>`;
            status.innerText = "Cloud Ready";
            status.classList.replace('bg-orange-500', 'bg-blue-500');
        }
    });

    function resetForm() {
        document.getElementById('fitness-form').reset();
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        document.getElementById('foodList').innerHTML = '';
        currentFoodItems = []; currentTotalFoodKcal = 0;
    }

    function showModal() { document.getElementById('successModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('successModal').classList.add('hidden'); }

    async function calculateKcalWithAI() {
        if(!GEMINI_API_KEY) { alert("กรุณาใส่ API Key สำหรับ AI ก่อนครับ"); return; }
        const food = document.getElementById('foodName').value;
        if(!food) return;
        const aiBtn = document.getElementById('aiSearchBtn');
        aiBtn.innerText = "...";
        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Estimate kcal for "${food}". Return only number.` }] }] })
            });
            const res = await resp.json();
            const val = res.candidates[0].content.parts[0].text.match(/\d+/);
            if(val) document.getElementById('singleFoodKcal').value = val[0];
        } catch(e) { console.error(e); } finally { aiBtn.innerText = "AI"; }
    }
</script>
</body>
</html>
