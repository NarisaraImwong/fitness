<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker AI Dashboard - ครูไอซ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; }
        .active-tab { color: #3b82f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .loading-spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card-custom { @apply bg-white rounded-[2.5rem] p-6 shadow-sm border border-white; }
        .gradient-header { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        /* Hide scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 pb-28">

    <div class="max-w-md mx-auto min-h-screen relative overflow-hidden bg-[#f8fafc]">
        
        <!-- Tab: Log View -->
        <div id="log-view" class="tab-content active">
            <header class="gradient-header text-white p-10 pb-16 rounded-b-[4rem] shadow-xl">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-blue-100 text-xs font-medium mb-1">ยินดีต้อนรับกลับมาค่ะ</p>
                        <h1 class="text-3xl font-bold italic">ครูไอซ์</h1>
                    </div>
                    <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-md">
                        <i class="ph ph-sparkle text-2xl text-yellow-300"></i>
                    </div>
                </div>
            </header>

            <main class="px-6 -mt-10 space-y-6">
                <form id="fitness-form" class="space-y-6">
                    
                    <!-- ส่วนหัว: วันที่และน้ำหนัก -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="card-custom text-center">
                            <span class="text-[10px] font-bold text-blue-500 uppercase tracking-tighter">วันที่</span>
                            <input type="date" id="date" class="w-full mt-1 text-center font-bold text-gray-700 outline-none bg-transparent">
                        </div>
                        <div class="card-custom text-center">
                            <span class="text-[10px] font-bold text-blue-500 uppercase tracking-tighter">น้ำหนัก (kg)</span>
                            <input type="number" id="weight" step="0.1" placeholder="0.0" class="w-full mt-1 text-center font-bold text-gray-700 outline-none bg-transparent">
                        </div>
                    </div>

                    <!-- การเผาผลาญจากนาฬิกา -->
                    <div class="card-custom bg-orange-50/50 border-orange-100">
                        <div class="flex items-center gap-2 mb-4">
                            <i class="ph ph-watch text-orange-500 text-xl"></i>
                            <h3 class="font-bold text-orange-900 text-sm">บันทึกจาก Smartwatch</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white/80 p-3 rounded-2xl shadow-sm text-center">
                                <label class="text-[9px] font-bold text-orange-400 block mb-1 uppercase">ก้าวเดินวันนี้</label>
                                <input type="number" id="steps" placeholder="0" class="w-full text-center font-black text-orange-600 outline-none bg-transparent">
                            </div>
                            <div class="bg-white/80 p-3 rounded-2xl shadow-sm text-center">
                                <label class="text-[9px] font-bold text-orange-400 block mb-1 uppercase">Active Cal</label>
                                <input type="number" id="watchKcal" placeholder="0" class="w-full text-center font-black text-orange-600 outline-none bg-transparent">
                            </div>
                        </div>
                    </div>

                    <!-- AI Food Assistant -->
                    <div class="card-custom bg-emerald-50/50 border-emerald-100">
                        <div class="flex items-center gap-2 mb-4">
                            <i class="ph ph-cooking-pot text-emerald-600 text-xl"></i>
                            <h3 class="font-bold text-emerald-900 text-sm">AI ช่วยคำนวณแคลอรี่</h3>
                        </div>
                        <div class="flex gap-2 mb-4">
                            <input type="text" id="foodName" placeholder="กินเมนูไหนดีคะ?" class="flex-grow bg-white border border-emerald-100 rounded-2xl p-4 text-sm outline-none shadow-sm focus:border-emerald-300 transition-all">
                            <button type="button" onclick="calculateKcalWithAI()" id="aiSearchBtn" class="bg-blue-600 text-white px-6 rounded-2xl text-xs font-bold shadow-md hover:bg-blue-700 active:scale-95 transition-all">
                                ถาม AI
                            </button>
                        </div>
                        <div class="flex gap-3 items-end">
                            <div class="w-1/3">
                                <label class="text-[9px] font-bold text-emerald-600 ml-1 mb-1 block">KCAL</label>
                                <input type="number" id="singleFoodKcal" placeholder="0" class="w-full bg-white border border-emerald-100 rounded-2xl p-4 text-sm font-black text-emerald-600 text-center outline-none shadow-sm">
                            </div>
                            <button type="button" onclick="addFoodItem()" class="flex-grow bg-emerald-600 text-white font-bold h-[52px] rounded-2xl text-sm shadow-lg hover:bg-emerald-700 active:scale-95 transition-all">
                                เพิ่มรายการอาหาร
                            </button>
                        </div>
                        <div id="food-list-area" class="hidden mt-6 pt-4 border-t border-emerald-200/30">
                            <ul id="foodList" class="space-y-2 mb-4 max-h-40 overflow-y-auto scrollbar-hide"></ul>
                            <div class="flex justify-between items-center bg-emerald-100/50 p-4 rounded-2xl">
                                <span class="text-xs font-bold text-emerald-800 uppercase">รวมแคลอรี่กิน</span>
                                <span class="text-xl font-black text-emerald-800"><span id="foodTotalDisplay">0</span> <small class="text-[10px]">kcal</small></span>
                            </div>
                        </div>
                    </div>

                    <!-- เครื่องเล่นออกกำลังกาย -->
                    <div class="card-custom bg-indigo-50/50 border-indigo-100">
                        <h3 class="font-bold text-indigo-900 text-sm flex items-center gap-2 mb-4"><i class="ph ph-activity text-xl"></i> ข้อมูลการออกกำลังกาย</h3>
                        <select id="machineType" class="w-full bg-white border border-indigo-100 rounded-2xl p-4 text-sm outline-none shadow-sm mb-4">
                            <option value="None">-- เลือกประเภท --</option>
                            <optgroup label="คาร์ดิโอ (Cardio)">
                                <option value="Treadmill">ลู่วิ่งไฟฟ้า (Treadmill)</option>
                                <option value="Running">วิ่ง (Running/Jogging)</option>
                                <option value="Swimming">ว่ายน้ำ (Swimming)</option>
                                <option value="Elliptical">เครื่องเดินวงรี (Elliptical)</option>
                                <option value="Bike">จักรยาน (Bike)</option>
                                <option value="Zumba">ซูมบ้า (Zumba)</option>
                            </optgroup>
                            <optgroup label="เสริมสร้างกล้ามเนื้อ">
                                <option value="Weight">เวทเทรนนิ่ง (Weight Training)</option>
                                <option value="Bodyweight">บอดี้เวท (Bodyweight)</option>
                            </optgroup>
                            <optgroup label="ความยืดหยุ่น">
                                <option value="Yoga">โยคะ (Yoga)</option>
                                <option value="Pilates">พิลาทิส (Pilates)</option>
                            </optgroup>
                        </select>
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-white p-3 rounded-2xl text-center">
                                <span class="text-[8px] text-indigo-400 font-bold uppercase block mb-1">นาที</span>
                                <input type="number" id="exerciseTime" placeholder="0" class="w-full text-center font-bold text-indigo-600 bg-transparent outline-none">
                            </div>
                            <div class="bg-white p-3 rounded-2xl text-center">
                                <span class="text-[8px] text-indigo-400 font-bold uppercase block mb-1">กม.</span>
                                <input type="number" id="exerciseDist" step="0.1" placeholder="0" class="w-full text-center font-bold text-indigo-600 bg-transparent outline-none">
                            </div>
                            <div class="bg-white p-3 rounded-2xl text-center">
                                <span class="text-[8px] text-indigo-400 font-bold uppercase block mb-1">แคลเครื่อง</span>
                                <input type="number" id="exerciseKcal" placeholder="0" class="w-full text-center font-bold text-indigo-600 bg-transparent outline-none">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full gradient-header text-white font-bold py-6 rounded-[2.5rem] shadow-2xl flex items-center justify-center gap-3 hover:brightness-110 active:scale-[0.98] transition-all">
                        <i class="ph ph-check-circle text-2xl"></i> <span class="text-lg">บันทึกข้อมูลวันนี้</span>
                    </button>
                </form>
            </main>
        </div>

        <!-- Tab: Stats View -->
        <div id="stats-view" class="tab-content p-8">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-slate-800">สถิติ</h1>
                    <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">7 วันย้อนหลัง</p>
                </div>
                <button onclick="fetchDataFromSheet()" class="bg-white p-3 rounded-full shadow-md text-blue-600 active:rotate-180 transition-all duration-500">
                    <i class="ph ph-arrow-counter-clockwise text-xl font-bold"></i>
                </button>
            </header>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="card-custom bg-blue-600 text-white shadow-blue-200 shadow-xl border-none">
                    <span class="text-[9px] opacity-70 font-bold uppercase mb-1 block">น้ำหนักล่าสุด</span>
                    <h2 class="text-2xl font-black" id="latestWeightDisplay">-- <small class="text-xs">kg</small></h2>
                </div>
                <div class="card-custom bg-emerald-600 text-white shadow-emerald-200 shadow-xl border-none">
                    <span class="text-[9px] opacity-70 font-bold uppercase mb-1 block">สมดุลแคลวันนี้</span>
                    <h2 class="text-2xl font-black" id="netCalDisplay">-- <small class="text-xs">kcal</small></h2>
                </div>
            </div>

            <div class="space-y-8">
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-white h-72">
                    <canvas id="weightChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-white h-72">
                    <canvas id="calorieChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Floating Navbar -->
        <nav class="fixed bottom-6 left-6 right-6 max-w-md mx-auto bg-white/80 backdrop-blur-2xl px-10 py-5 flex justify-between items-center z-50 rounded-[2.5rem] shadow-2xl border border-white/50">
            <button onclick="switchTab('log')" id="nav-log" class="flex flex-col items-center gap-1 active-tab transition-all">
                <i class="ph ph-pencil-simple-line text-2xl font-bold"></i>
                <span class="text-[9px] font-black uppercase">บันทึก</span>
            </button>
            <div class="w-14 h-14 gradient-header rounded-2xl flex items-center justify-center -mt-16 shadow-xl shadow-blue-200 border-4 border-white active:scale-90 transition-all" onclick="switchTab('log')">
                <i class="ph ph-plus-bold text-white text-2xl"></i>
            </div>
            <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center gap-1 text-slate-300 transition-all">
                <i class="ph ph-chart-bar text-2xl font-bold"></i>
                <span class="text-[9px] font-black uppercase">ผลลัพธ์</span>
            </button>
        </nav>
    </div>

<script>
    // === CONFIGURATION ===
    const SCRIPT_URL = "ใส่_WEB_APP_URL_ที่ได้จาก_APPS_SCRIPT_ตรงนี้"; 
    const apiKey = ""; 

    let totalFoodKcal = 0;
    let weightChartInstance, calorieChartInstance;

    function switchTab(tab) {
        document.getElementById('log-view').classList.toggle('active', tab === 'log');
        document.getElementById('stats-view').classList.toggle('active', tab === 'stats');
        document.getElementById('nav-log').classList.toggle('active-tab', tab === 'log');
        document.getElementById('nav-stats').classList.toggle('active-tab', tab === 'stats');
        if(tab === 'stats') fetchDataFromSheet();
    }

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // --- AI SYSTEM (Gemini 2.5 Flash) ---
    async function calculateKcalWithAI() {
        const food = document.getElementById('foodName').value.trim();
        if(!food) return;

        const btn = document.getElementById('aiSearchBtn');
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner"></div>`;

        const systemPrompt = "คุณคือผู้เชี่ยวชาญด้านโภชนาการ ให้ข้อมูลแคลอรี่ของอาหาร 1 จาน/หน่วย ให้ตอบกลับเฉพาะตัวเลขแคลอรี่เพียงอย่างเดียวเท่านั้น ห้ามมีข้อความอื่น";
        const userQuery = `เมนู "${food}" มีกี่แคลอรี่?`;

        let retries = 5;
        let delay = 1000;

        const callAI = async () => {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                const kcalMatch = text?.match(/\d+/);

                if (kcalMatch) {
                    document.getElementById('singleFoodKcal').value = kcalMatch[0];
                } else {
                    throw new Error("No numbers found");
                }
            } catch (error) {
                if (retries > 0) {
                    retries--;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                    return callAI();
                } else {
                    console.error("AI final error:", error);
                    alert("AI ไม่ตอบสนองชั่วคราว ลองกรอกเองดูก่อนนะคะคุณครู");
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "ถาม AI";
            }
        };

        callAI();
    }

    function addFoodItem() {
        const name = document.getElementById('foodName').value || "อาหาร";
        const kcal = parseInt(document.getElementById('singleFoodKcal').value) || 0;
        if(kcal <= 0) return;
        
        totalFoodKcal += kcal;
        document.getElementById('foodTotalDisplay').innerText = totalFoodKcal;
        document.getElementById('food-list-area').classList.remove('hidden');
        
        const li = document.createElement('li');
        li.className = "flex justify-between items-center p-3 bg-white/50 rounded-xl border border-emerald-50 mb-1";
        li.innerHTML = `<span class="text-xs font-medium text-slate-600">${name}</span><span class="font-bold text-emerald-600 text-xs">${kcal} kcal</span>`;
        document.getElementById('foodList').prepend(li);
        
        document.getElementById('foodName').value = ""; 
        document.getElementById('singleFoodKcal').value = "";
    }

    document.getElementById('fitness-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner mx-auto"></div>`;

        const payload = {
            date: document.getElementById('date').value,
            weight: parseFloat(document.getElementById('weight').value) || 0,
            steps: parseInt(document.getElementById('steps').value) || 0,
            watchKcal: parseInt(document.getElementById('watchKcal').value) || 0,
            machineType: document.getElementById('machineType').value,
            exerciseTime: parseInt(document.getElementById('exerciseTime').value) || 0,
            exerciseDist: parseFloat(document.getElementById('exerciseDist').value) || 0,
            exerciseKcal: parseInt(document.getElementById('exerciseKcal').value) || 0,
            foodKcal: totalFoodKcal
        };

        try {
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify(payload) 
            });
            alert("บันทึกข้อมูลเรียบร้อยแล้วค่ะคุณครูไอซ์ ✨");
            location.reload();
        } catch(err) {
            alert("บันทึกไม่สำเร็จ ลองตรวจสอบ URL ของ App Script อีกครั้งนะคะ");
            btn.disabled = false;
            btn.innerText = "บันทึกข้อมูลวันนี้";
        }
    });

    async function fetchDataFromSheet() {
        try {
            const response = await fetch(SCRIPT_URL);
            const result = await response.json();
            if(result.result === "success") {
                renderCharts(result.data);
            }
        } catch(e) {
            console.error("Data fetch error:", e);
        }
    }

    function renderCharts(data) {
        if(!data || data.length === 0) return;

        const last7 = data.slice(-7);
        const labels = last7.map(r => new Date(r[0]).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }));
        const weights = last7.map(r => r[1]);
        const foodIn = last7.map(r => parseInt(r[8]) || 0);
        const burnOut = last7.map(r => (parseInt(r[3]) || 0) + (parseInt(r[7]) || 0));

        document.getElementById('latestWeightDisplay').innerHTML = `${weights[weights.length-1]} <small class="text-xs">kg</small>`;
        const net = foodIn[foodIn.length-1] - burnOut[burnOut.length-1];
        document.getElementById('netCalDisplay').innerHTML = `${net} <small class="text-xs">kcal</small>`;

        if(weightChartInstance) weightChartInstance.destroy();
        weightChartInstance = new Chart(document.getElementById('weightChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'น้ำหนัก (kg)',
                    data: weights,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: false } }
            }
        });

        if(calorieChartInstance) calorieChartInstance.destroy();
        calorieChartInstance = new Chart(document.getElementById('calorieChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'กินเข้าไป', data: foodIn, backgroundColor: '#10b981', borderRadius: 8 },
                    { label: 'เบิร์นออก', data: burnOut, backgroundColor: '#f59e0b', borderRadius: 8 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
            }
        });
    }
</script>
</body>
</html>
