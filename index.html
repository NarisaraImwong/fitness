<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Fitness Tracker (Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: bold; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2"><i class="ph ph-heartbeat"></i> My Fitness Sync</h1>
        <div id="sync-status" class="text-[10px] bg-blue-500 px-2 py-1 rounded-full border border-blue-400">Cloud Ready</div>
    </header>

    <main class="p-4">
        <form id="fitness-form" class="space-y-4">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase">วันที่</label>
                    <input type="date" id="date" class="w-full border rounded-lg p-2 bg-gray-50 outline-none" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase">น้ำหนัก (kg)</label>
                    <input type="number" id="weight" step="0.1" placeholder="0.0" class="w-full border rounded-lg p-2 bg-gray-50 outline-none" required>
                </div>
            </div>

            <div class="bg-green-50 p-3 rounded-xl border border-green-100 space-y-3">
                <h3 class="text-sm font-bold text-green-800">📊 กิจกรรม & อาหาร</h3>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="steps" placeholder="จำนวนก้าว" class="w-full border rounded-lg p-3 outline-none shadow-sm">
                    <input type="number" id="watchKcal" placeholder="Watch (kcal)" class="w-full border rounded-lg p-3 outline-none shadow-sm">
                </div>
                
                <div class="border-t border-green-200 pt-3">
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="foodName" placeholder="ชื่ออาหาร" class="flex-grow border rounded-lg p-3 outline-none text-sm">
                        <button type="button" onclick="calculateKcalWithAI()" id="aiSearchBtn" class="bg-blue-600 text-white px-4 rounded-lg text-xs font-bold">ถาม AI</button>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="singleFoodKcal" placeholder="kcal" class="w-1/3 border rounded-lg p-3 outline-none text-sm">
                        <button type="button" onclick="addFoodItem()" class="flex-grow bg-emerald-600 text-white font-bold rounded-lg text-sm">เพิ่มอาหาร</button>
                    </div>
                    <ul id="foodList" class="mt-2 space-y-1"></ul>
                    <input type="hidden" id="foodKcal" value="0">
                </div>
            </div>

            <div class="bg-purple-50 p-3 rounded-xl border border-purple-100 space-y-3">
                <h3 class="text-sm font-bold text-purple-800">🏃 การออกกำลังกาย</h3>
                <select id="machineType" class="w-full border rounded-lg p-3 outline-none bg-white">
                    <option value="None">ไม่ได้ออกกำลังกาย</option>
                    <option value="Running">วิ่ง (Running)</option>
                    <option value="Swimming">ว่ายน้ำ (Swimming)</option>
                    <option value="Walking">เดินเร็ว (Power Walking)</option>
                    <option value="Cycling">ปั่นจักรยาน (Cycling)</option>
                    <option value="Treadmill">ลู่วิ่งไฟฟ้า</option>
                    <option value="WeightTraining">เวทเทรนนิ่ง</option>
                </select>
                <div id="machineDetails" class="hidden grid grid-cols-3 gap-2">
                    <input type="number" id="machineKcal" placeholder="kcal" class="border rounded-lg p-2 text-sm">
                    <input type="number" id="duration" placeholder="นาที" class="border rounded-lg p-2 text-sm">
                    <input type="number" id="distance" step="0.01" placeholder="กม." class="border rounded-lg p-2 text-sm">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition">
                <i class="ph ph-cloud-arrow-up"></i> <span>บันทึกไปที่ Google Sheets</span>
            </button>
        </form>
    </main>
</div>

<div id="successModal" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-3xl p-8 flex flex-col items-center w-72 shadow-2xl">
        <i class="ph-fill ph-check-circle text-6xl text-green-500 mb-4"></i>
        <h3 class="text-xl font-bold text-gray-800">บันทึกสำเร็จ!</h3>
        <button onclick="location.reload()" class="mt-6 bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold w-full">ตกลง</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzF-FGC967CxqDPy-G2otPnxg00qIjN6S6PNRhUEyBAeq6YeVc-uU0dRW5AVxR1A-KU/exec";
    const GEMINI_API_KEY = "AIzaSyC5MrgcUs0PVksZqDd3PIuzA_499lJrPmM"; 

    let currentTotalFoodKcal = 0;

    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    document.getElementById('machineType').addEventListener('change', function() {
        document.getElementById('machineDetails').classList.toggle('hidden', this.value === 'None');
    });

    function addFoodItem() {
        const n = document.getElementById('foodName'), k = document.getElementById('singleFoodKcal');
        if (!k.value) return;
        currentTotalFoodKcal += parseInt(k.value);
        document.getElementById('foodKcal').value = currentTotalFoodKcal;
        document.getElementById('foodList').innerHTML += `<li class="text-[10px] flex justify-between bg-white p-1 px-2 rounded border"><span>${n.value || 'อาหาร'}</span><b>${k.value} kcal</b></li>`;
        n.value = ''; k.value = '';
    }

    async function calculateKcalWithAI() {
        const food = document.getElementById('foodName').value;
        if(!food) return;
        const aiBtn = document.getElementById('aiSearchBtn');
        aiBtn.innerText = "...";
        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Estimate kcal for "${food}". Return only the number.` }] }] })
            });
            const res = await resp.json();
            const val = res.candidates[0].content.parts[0].text.match(/\d+/);
            if(val) document.getElementById('singleFoodKcal').value = val[0];
        } catch(e) { console.error(e); } finally { aiBtn.innerText = "ถาม AI"; }
    }

    document.getElementById('fitness-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner"></div> <span>กำลังบันทึก...</span>`;
        
        const payload = {
            date: document.getElementById('date').value,
            weight: parseFloat(document.getElementById('weight').value),
            steps: parseInt(document.getElementById('steps').value) || 0,
            watchKcal: parseInt(document.getElementById('watchKcal').value) || 0,
            foodKcal: parseInt(document.getElementById('foodKcal').value) || 0,
            machineType: document.getElementById('machineType').value,
            machineKcal: parseInt(document.getElementById('machineKcal').value) || 0,
            duration: parseInt(document.getElementById('duration').value) || 0,
            distance: parseFloat(document.getElementById('distance').value) || 0
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            document.getElementById('successModal').classList.remove('hidden');
        } catch (error) {
            alert("เกิดข้อผิดพลาด ลองตรวจสอบการเชื่อมต่ออินเทอร์เน็ตนะคะ");
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
